esphome:
  name: thermostat
  platformio_options:
    upload_speed: 921600


esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: VERBOSE

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Optional: helpful if you move it around while testing
  fast_connect: true

esp32_ble_tracker:
  scan_parameters:
    interval: 300ms
    window: 300ms
    active: false

ble_client:
  - mac_address: A4:C1:38:C7:69:F2
    auto_connect: false
    id: dev69F2_bt

pvvx_client:
  - id: dev69F2_pvvx
    ble_client_id: dev69F2_bt

bthome:
  remote_devices:
    - id: dev69F2
      mac_address: A4:C1:38:C7:69:F2

binary_sensor:
  - platform: bthome
    id: thermostat_on
    source_id: dev69F2
    type: running_active
    on_state:
      then:
        - lambda: |-
            if(!id(onoff_synced)) {
              ESP_LOGD("main", "On/Off is not synced. Ignoring target value coming from device");
              return;
            }

            auto target_mode = x ? climate::CLIMATE_MODE_HEAT : climate::CLIMATE_MODE_OFF;
            if(target_mode != id(this_climate).mode) {
              auto call = this_climate->make_call();
              call.set_mode(target_mode);
              id(disable_updating) = true;
              call.perform();
              id(disable_updating) = false;
            }

sensor:
  - platform: bthome
    id: humidity
    name: "Room Humidity"
    source_id: dev69F2
    type: HUMIDITY
  - platform: bthome
    id: current_temp
    source_id: dev69F2
    type: temperature
  - platform: bthome
    id: target_temp
    source_id: dev69F2
    type: temperature
    on_value:
      then:
        - lambda: |-
            if(!id(target_temp_synced)) {
              ESP_LOGD("main", "Device is not synced. Ignoring target temperature report coming from device");
              return;
            }
            auto traits = this_climate->get_traits();
            x = std::clamp(x, traits.get_visual_min_temperature(), traits.get_visual_max_temperature());
            if (int(id(this_climate).target_temperature*100) != int(x*100)) {
              auto call = this_climate->make_call();
              call.set_target_temperature(x);
              id(disable_updating) = true;
              call.perform();
              id(disable_updating) = false;
            }

climate:
  - platform: thermostat
    name: "Thermostat Climate Controller"
    id: this_climate
    sensor: current_temp
    min_heating_off_time: 300s
    min_heating_run_time: 300s
    min_idle_time: 30s
    heat_action:
      - logger.log: "Turning heater on"
    idle_action:
      - logger.log: "Turning heater off"
    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 20 °C
    on_control:
      - logger.log: "Control action triggered"
      - if:
          condition:
            lambda: |-
              return x.get_target_temperature().has_value();
          then:
            - if:
                condition:
                  lambda: return id(disable_updating);
                then:
                  - logger.log: "Update disabled to avoid loop"
                else:
                  - globals.set:
                      id: desired_target_temp
                      value: !lambda return x.get_target_temperature().value();
                  - globals.set:
                      id: target_temp_synced
                      value: 'false'
                  - script.execute:
                      id: dev_set_target_temperature
                      target_temp: !lambda return x.get_target_temperature().value();
                  - component.resume: target_temp_syncer
      - if:
          condition:
            lambda: |-
              return x.get_mode().has_value();
          then:
            - if:
                condition:
                  lambda: return id(disable_updating);
                then:
                  - logger.log: "Update disabled to avoid loop"
                else:
                  - globals.set:
                      id: onoff_desired
                      value: !lambda return x.get_mode().value() == climate::CLIMATE_MODE_HEAT;
                  - globals.set:
                      id: onoff_synced
                      value: 'false'
                  - script.execute:
                      id: dev_set_onoff
                      onoff: !lambda return x.get_mode().value() == climate::CLIMATE_MODE_HEAT;
                  - component.resume: onoff_syncer

globals:
  - id: disable_updating
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: dev_updating
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: desired_target_temp
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: target_temp_synced
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: onoff_updating
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: onoff_desired
    type: bool
    restore_value: no
    initial_value: '0.0'
  - id: onoff_synced
    type: bool
    restore_value: no
    initial_value: 'true'




interval:
  - interval: 30s
    id: target_temp_syncer
    then:
      - if:
          condition:
            lambda: return id(target_temp_synced);
          then:
            - component.suspend: target_temp_syncer
          else:
            - script.execute:
                id: dev_set_target_temperature
                target_temp: !lambda return id(desired_target_temp);
  - interval: 30s
    id: onoff_syncer
    then:
      - if:
          condition:
            lambda: return id(onoff_synced);
          then:
            - component.suspend: onoff_syncer
          else:
            - script.execute:
                id: dev_set_onoff
                onoff: !lambda return id(onoff_desired);  

script:
  - id: dev_set_target_temperature
    mode: single
    parameters:
      target_temp: float
    then:
      - if:
          condition:
            lambda: return id(dev_updating);
          then:
            - logger.log: "Already updating, skipping to avoid loop"
            - script.stop: dev_set_target_temperature
      - lambda: |-
          ESP_LOGD("main", "Preparing to send target temperature update: %g °C", target_temp);

          auto& client = *id(dev69F2_pvvx);

          float cmf_tmp_lo = target_temp;
          float cmf_tmp_hi = cmf_tmp_lo + 1;
          float cmf_hm_lo = 0;
          float cmf_hm_hi = 100;
  
          int16_t tmp_lo = (int16_t)round(cmf_tmp_lo * 100.0f);
          int16_t tmp_hi = (int16_t)round(cmf_tmp_hi * 100.0f);
          int16_t hm_lo = (int16_t)round(cmf_hm_lo * 100.0f);
          int16_t hm_hi = (int16_t)round(cmf_hm_hi * 100.0f);

          // Construct the payload
          std::vector<uint8_t> data = {
                0x20,
                (uint8_t)(tmp_lo & 0xff), (uint8_t)((tmp_lo >> 8) & 0xff),
                (uint8_t)(tmp_hi & 0xff), (uint8_t)((tmp_hi >> 8) & 0xff),
                (uint8_t)(hm_lo & 0xff),  (uint8_t)((hm_lo >> 8) & 0xff),
                (uint8_t)(hm_hi & 0xff),  (uint8_t)((hm_hi >> 8) & 0xff)
            };          
          ESP_LOGD("main", "Sending data hex: %s", format_hex(data.data(), data.size()).c_str());
          client.send_data(data.data(), data.size(), [](const uint8_t *resp, size_t len, int err) {
            dev_updating->value() = false;
            if (err != esphome::pvvx_client::PVVXClient::ERR_NONE) {
              ESP_LOGE("main", "Failed to send data, error code: %d", err);
              return;
            }
            ESP_LOGD("main", "Data sent successfully, response hex: %s", format_hex(resp, len).c_str());
            target_temp_synced->value() = true;
          });
  - id: dev_set_onoff
    mode: single
    parameters:
      onoff: bool
    then:
      - if:
          condition:
            lambda: return id(onoff_updating);
          then:
            - logger.log: "Already updating, skipping to avoid loop"
            - script.stop: dev_set_onoff
      - lambda: |-
          ESP_LOGD("main", "Preparing to send on/off update: %s", onoff ? "ON" : "OFF");

          auto& client = *id(dev69F2_pvvx);

          std::vector<uint8_t> data = { 0x2d, uint8_t(onoff ? 0x01 : 0x00) };
          
          ESP_LOGD("main", "Sending data hex: %s", format_hex(data.data(), data.size()).c_str());
          client.send_data(data.data(), data.size(), [](const uint8_t *resp, size_t len, int err) {
            onoff_updating->value() = false;
            if (err != esphome::pvvx_client::PVVXClient::ERR_NONE) {
              ESP_LOGE("main", "Failed to send data, error code: %d", err);
              return;
            }
            ESP_LOGD("main", "Data sent successfully, response hex: %s", format_hex(resp, len).c_str());
            onoff_synced->value() = true;
          });

